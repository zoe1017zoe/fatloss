/* ========= 底部面板 ========= */
const sheets = [];
function openSheet(html){
  const bd = document.createElement('div'); bd.className='backdrop';
  bd.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  bd.addEventListener('click', e=>{ if(e.target === bd){ if(bd._onBackdrop) bd._onBackdrop(); else closeSheet(); } });
  document.body.appendChild(bd); sheets.push(bd);
  document.body.style.overflow='hidden';
  updateJump();
  return bd.querySelector('.sheet');
}
function closeSheet(){
  const bd = sheets.pop(); if(bd){ if(bd._onClosed) bd._onClosed(); bd.remove(); }
  if(!sheets.length) document.body.style.overflow='';
  updateJump();
}

/* ========= 背景照片辨識 ========= */
const JOBS = new Map();   // mealId -> 進行中的辨識
const RECOG_HINT = '辨識中，請先不要離開 APP';
function blobToBase64(blob){
  return new Promise((res, rej)=>{ const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
}
function startRecognition(base64s, date, mealType, entries){
  // entries：編輯視窗中這次加入的照片物件，存入資料庫後會帶有 id
  const job = {entries: entries || [], ids: [], running: true, mealId: null, editor: null, cancelled: false};
  job.pendingIds = () => [...job.ids, ...job.entries.map(e=>e.id)].filter(Boolean);
  (async()=>{
    let got = [], err = '';
    try{
      const ctx = await buildContext(date, mealType, true, false);
      const r = await callGemini([...base64s.map(b=>({inline_data:{mime_type:'image/jpeg', data:b}})), {text:`【APP 提供的狀態】\n${ctx}\n\n【學員訊息】\n（附上 ${base64s.length} 張餐點照片，全部屬於同一筆${MEAL_NAME[mealType]||'餐點'}。只需要辨識品項填入 meals；可以辨識時 reply 給空字串，無法辨識時 meals 給空陣列，並在 reply 用一句話說明原因。）`}], await systemPrompt());
      const src = Array.isArray(r.meals) ? r.meals.flatMap(m=>Array.isArray(m && m.items) ? m.items : []) : (Array.isArray(r.items) ? r.items : []);
      got = await resolveItems(src);
      if(!got.length) err = r.reply || '照片中找不到可辨識的食物，請換一張照片或手動輸入';
    }catch(e){ err = e.message === 'NO_KEY' ? '請先到設定輸入 API 金鑰' : e.message; }
    job.running = false;
    if(job.mealId) JOBS.delete(job.mealId);
    if(job.cancelled) return;
    if(job.mealId) await applyRecognition(job, got, err);
    if(job.editor) job.editor(got, err);
    if(state.tab === 'today') render();
  })();
  return job;
}
async function applyRecognition(job, got, err){
  const m = await DB.meals.get(job.mealId); if(!m) return;
  const pend = job.pendingIds().length ? job.pendingIds() : (m.pendingIds || []);
  if(!err){
    await DB.meals.update(m.id, {items:[...m.items, ...got], pending:false, pendingIds:[], failReason:'', updatedAt:Date.now()});
    return;
  }
  const keep = photoIdsOf(m).filter(id=>!pend.includes(id));
  if(!m.items.length && !job.editor){
    await DB.meals.delete(m.id);
    await deletePhotosIfUnused([...pend, ...keep]);
    toast('辨識失敗：' + err, 5000);
  } else {
    await DB.meals.update(m.id, {photoIds:keep, photoId:keep[0]||null, pending:false, pendingIds:[], failReason: job.editor ? '' : err});
    await deletePhotosIfUnused(pend);
  }
}
async function retryRecognition(mealId){
  if(!S.apiKey){ toast('拍照辨識需要 API 金鑰，請先到設定輸入'); return; }
  const m = await DB.meals.get(mealId); if(!m) return;
  const ids = (m.pendingIds || []).length ? m.pendingIds : photoIdsOf(m);
  const base64s = [];
  for(const id of ids){ const p = await DB.photos.get(id); if(p) base64s.push(await blobToBase64(p.blob)); }
  if(!base64s.length){ await DB.meals.update(mealId, {pending:false, pendingIds:[]}); render(); return; }
  await DB.meals.update(mealId, {pending:true, pendingIds:ids, failReason:''});
  const job = startRecognition(base64s, m.date, m.mealType);
  job.ids = ids; job.mealId = mealId; JOBS.set(mealId, job);
  render();
}

/* ========= 餐點編輯 ========= */
async function openMealEditor(opt){
  // opt: {id?, date, mealType, items, comment, photoBlob?, photoId?, photoIds?, sourceText, isNew, manual?}
  let items = opt.items.map(i=>({...i}));
  let mealType = opt.mealType;
  let photos = photoIdsOf(opt).map(id=>({id}));
  if(opt.photoBlob) photos.push({blob:opt.photoBlob, url:URL.createObjectURL(opt.photoBlob)});
  const removedIds = [];
  let job = opt.id ? (JOBS.get(opt.id) || null) : null;   // 這筆餐點在背景辨識中
  const sh = openSheet(`<div class="between"><h2>${opt.manual?'新增餐點':opt.isNew?'確認餐點':'編輯餐點'}</h2><span class="small muted">${md2(opt.date)}</span></div>
    <div class="seg" id="me-type"></div>
    <div id="me-photobox"></div>
    <div class="notice" id="me-msg" hidden style="background:var(--bad-soft);color:var(--bad);margin-top:12px"></div>
    ${opt.isNew && opt.comment?'<p class="small muted" style="margin:10px 2px 0">AI 估算值僅供參考，份量或數值不對請直接修改。</p>':''}
    <div id="me-items"></div>
    <p class="small" id="me-hint" hidden style="margin:0 2px 8px;color:var(--warn)">${RECOG_HINT}，也可以點視窗外關閉，完成後會自動寫入</p>
    <div class="btns" style="gap:6px"><button class="btn ghost sm" id="me-cam" style="flex:1;padding:8px 2px;font-size:13px">照片</button><button class="btn ghost sm" id="me-food" style="flex:1;padding:8px 2px;font-size:13px">常用食品</button><button class="btn ghost sm" id="me-add" style="flex:1;padding:8px 2px;font-size:13px">空白自填</button></div>
    <div class="totals num" id="me-tot"></div>
    ${opt.comment?`<details class="comment card" style="padding:0 14px" ${opt.isNew?'open':''}><summary>教練點評</summary><div class="md">${md(opt.comment)}</div></details>`:''}
    <div class="btns" style="margin-top:12px">${opt.isNew?'<button class="btn danger" id="me-cancel" style="flex:1">放棄</button>':'<button class="btn danger" id="me-del" style="flex:1">刪除</button>'}<button class="btn" id="me-save" style="flex:2">儲存</button></div>`);
  const $s = q => sh.querySelector(q);
  const sync = () => {
    sh.querySelectorAll('.item').forEach((el,idx)=>{
      const g = n => el.querySelector(`[data-f="${n}"]`).value;
      items[idx] = {...items[idx], name:g('name'), amount:g('amount'), kcal:num(g('kcal')), protein:num(g('protein')), carb:num(g('carb')), fat:num(g('fat'))};
    });
  };
  const drawType = () => { $s('#me-type').innerHTML = MEALS.map(([k,n])=>`<button class="${mealType===k?'on':''}" data-k="${k}">${n}</button>`).join(''); };
  const drawTot = () => {
    const tot = $s('#me-tot'), save = $s('#me-save');
    tot.hidden = !items.length;
    save.disabled = !items.some(i=>String(i.name||'').trim());
    const s = sumItems(items); tot.innerHTML = `<div><b>${fmt(s.kcal)}</b><span>大卡</span></div><div><b>${fmt(s.protein)}</b><span>蛋白質 g</span></div><div><b>${fmt(s.carb)}</b><span>碳水 g</span></div><div><b>${fmt(s.fat)}</b><span>脂肪 g</span></div>`; };
  const draw = () => {
    $s('#me-items').innerHTML = items.length ? items.map((i,idx)=>`<div class="item" data-idx="${idx}">
      <div class="item-head"><input class="in" data-f="name" value="${esc(i.name)}" placeholder="食物名稱"><button class="xbtn" data-del="${idx}" aria-label="刪除">×</button></div>
      <input class="in amount" data-f="amount" value="${esc(i.amount)}" placeholder="份量，例如 1 個便當、半碗">
      <div class="item-grid">
        <label>熱量<input class="in num" data-f="kcal" inputmode="decimal" value="${i.kcal}"></label>
        <label>蛋白質 g<input class="in num" data-f="protein" inputmode="decimal" value="${i.protein}"></label>
        <label>碳水 g<input class="in num" data-f="carb" inputmode="decimal" value="${i.carb}"></label>
        <label>脂肪 g<input class="in num" data-f="fat" inputmode="decimal" value="${i.fat}"></label>
      </div>
      ${i.foodId?'<div class="small muted" style="margin-top:4px">來自常用食品</div>':`<div style="display:flex;justify-content:flex-end;margin-top:10px"><button class="btn sm" data-savefood="${idx}">存為常用食品</button></div>`}
    </div>`).join('') : `<div class="empty">${job && job.running ? '辨識中…' : '尚無品項<br>請用下方「照片」「常用食品」或「空白自填」新增'}</div>`;
    drawTot();
  };
  const drawPhotos = () => {
    const box = $s('#me-photobox');
    box.innerHTML = photos.length ? `<div class="pstrip ${photos.length===1?'one':''}">${photos.map((ph,i)=>`<div class="pcell"><img ${ph.id?`data-photo="${ph.id}"`:`src="${ph.url}"`} alt=""><button class="pdel" data-pdel="${i}" aria-label="移除照片">×</button></div>`).join('')}</div>` : '';
    hydratePhotos(box);
  };
  const setBusy = on => {
    const cam = $s('#me-cam'); cam.disabled = on; cam.textContent = on ? '辨識中…' : '照片';
    $s('#me-hint').hidden = !on;
  };
  const showFail = reason => { const msg = $s('#me-msg'); msg.textContent = '辨識失敗：' + reason; msg.hidden = false; };
  // 辨識完成時，若視窗還開著就直接更新畫面
  const onDone = (got, err) => {
    if(!sh.isConnected) return;
    setBusy(false);
    if(err){
      const pend = job.pendingIds();
      photos = photos.filter(x=>!job.entries.includes(x) && !(x.id && pend.includes(x.id)));
      drawPhotos(); showFail(err);
    } else { sync(); items.push(...got); }
    job = null; draw();
  };
  if(job){ job.editor = onDone; setBusy(true); }
  else if(opt.failReason) showFail(opt.failReason);
  sh.parentElement._onClosed = () => { if(job) job.editor = null; };

  $s('#me-photobox').addEventListener('click', e=>{
    const b = e.target.closest('[data-pdel]'); if(!b) return;
    const ph = photos.splice(Number(b.dataset.pdel),1)[0]; if(ph && ph.id) removedIds.push(ph.id); drawPhotos();
  });
  drawPhotos(); drawType(); draw();
  $s('#me-type').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; mealType=b.dataset.k; drawType(); });
  $s('#me-items').addEventListener('input', ()=>{ sync(); drawTot(); });
  $s('#me-items').addEventListener('click', async e=>{
    const del = e.target.closest('[data-del]');
    if(del){ sync(); items.splice(Number(del.dataset.del),1); draw(); return; }
    const sf = e.target.closest('[data-savefood]');
    if(sf){ sync(); const i = items[Number(sf.dataset.savefood)]; openFoodForm({name:i.name, servingDesc:i.amount||'1 份', kcal:i.kcal, protein:i.protein, carb:i.carb, fat:i.fat}); }
  });
  $s('#me-add').onclick = () => { sync(); items.push({name:'',amount:'',kcal:0,protein:0,carb:0,fat:0}); draw(); };
  $s('#me-food').onclick = () => { sync(); openFoodPicker(picked=>{ items.push(...picked); draw(); }); };
  const recognize = async files => {
    const room = MAX_PHOTOS - photos.length;
    if(room <= 0){ toast(`每筆餐點最多 ${MAX_PHOTOS} 張照片`); return; }
    if(files.length > room) toast(`最多 ${MAX_PHOTOS} 張，已加入前 ${room} 張`);
    $s('#me-msg').hidden = true; setBusy(true);
    try{
      sync();
      const entries = [], base64s = [];
      for(const f of files.slice(0, room)){ const ph = await prepPhoto(f); base64s.push(ph.base64); const en = {blob:ph.blob, url:ph.preview}; entries.push(en); photos.push(en); }
      drawPhotos();
      job = startRecognition(base64s, opt.date, mealType, entries);
      job.editor = onDone;
      if(opt.id){ job.mealId = opt.id; }   // 編輯既有餐點：視窗關掉後結果會補進這一筆
      draw();
    }catch(err){ setBusy(false); showFail(err.message); }
  };
  const needKey = () => { if(!S.apiKey){ toast('拍照辨識需要 API 金鑰，請先到設定輸入'); return true; } return false; };
  $s('#me-cam').onclick = () => { if(!needKey()) pickImage(recognize); };

  // 存入資料庫；辨識中時標記為辨識中，完成後自動補上品項
  const persist = async () => {
    sync();
    const clean = items.filter(i=>String(i.name||'').trim()).map(normItem);
    for(const ph of photos) if(!ph.id) ph.id = await DB.photos.add({blob:ph.blob});
    const ids = photos.map(ph=>ph.id);
    const running = !!(job && job.running);
    const rec = {date:opt.date, mealType, items:clean, photoId:ids[0]||null, photoIds:ids, comment:opt.comment||'', sourceText:opt.sourceText||'',
      pending:running, pendingIds: running ? job.pendingIds().filter(id=>ids.includes(id)) : [], failReason:'', updatedAt:Date.now()};
    let id = opt.id;
    if(id) await DB.meals.update(id, rec);
    else {
      id = await DB.meals.add({...rec, createdAt:Date.now()});
      for(const i of clean) if(i.foodId){ const f = await DB.foods.get(i.foodId); if(f) await DB.foods.update(f.id,{useCount:(f.useCount||0)+1}); }
    }
    opt.id = id;
    if(running){ job.mealId = id; job.editor = null; JOBS.set(id, job); }
    await deletePhotosIfUnused(removedIds);
    return id;
  };
  // 點視窗外：辨識中就背景繼續並先存成卡片；沒在辨識就直接關閉
  sh.parentElement._onBackdrop = async () => {
    if(job && job.running){ await persist(); closeSheet(); toast('背景辨識中，完成後會自動寫入'); render(); }
    else closeSheet();
  };
  $s('#me-save').onclick = async () => {
    sync();
    if(!items.some(i=>String(i.name||'').trim())){ toast('至少需要一個品項'); return; }
    await persist();
    closeSheet(); toast('已儲存'); render();
  };
  const cancel = $s('#me-cancel');
  if(cancel) cancel.onclick = () => {
    if(!items.length && !photos.length && !job) { closeSheet(); return; }
    if(!confirm('確定放棄這筆餐點？')) return;
    if(job){ job.cancelled = true; job = null; }
    closeSheet();
  };
  const del = $s('#me-del');
  if(del) del.onclick = async () => {
    if(!confirm('確定刪除這筆餐點？')) return;
    if(job){ job.cancelled = true; JOBS.delete(opt.id); job = null; }
    await DB.meals.delete(opt.id);
    await deletePhotosIfUnused([...photoIdsOf(opt), ...removedIds, ...photos.map(p=>p.id).filter(Boolean)]);
    closeSheet(); toast('已刪除'); render();
  };
}

async function openFoodPicker(onDone){
  const foods = await DB.foods.orderBy('useCount').reverse().toArray();
  const qty = {};
  const sh = openSheet(`<h2>選擇常用食品</h2>
    <input class="in" id="fp-q" placeholder="搜尋" style="margin-bottom:6px">
    <div id="fp-list"></div>
    <div class="totals num" id="fp-tot"></div>
    <button class="btn" id="fp-ok">加入</button>`);
  const draw = () => {
    const q = sh.querySelector('#fp-q').value.trim();
    const list = foods.filter(f=>!q || (f.name+(f.brand||'')).includes(q));
    sh.querySelector('#fp-list').innerHTML = list.length ? list.map(f=>`<div class="foodrow"><div class="info"><div class="name">${esc(f.name)}</div><div class="small muted num">${esc(f.servingDesc||'1 份')} · ${fmt(f.kcal)} 大卡 · 蛋白質 ${fmt(f.protein)} g</div></div>
      <div class="stepper"><button data-d="-0.5" data-id="${f.id}">−</button><input class="num" data-q="${f.id}" inputmode="decimal" value="${qty[f.id]||0}"><button data-d="0.5" data-id="${f.id}">＋</button></div></div>`).join('')
      : `<div class="empty">${foods.length?'找不到符合的食品':'食品庫是空的，請先到「食品庫」新增'}</div>`;
    drawTot();
  };
  const drawTot = () => {
    const s = foods.reduce((a,f)=>{ const n=qty[f.id]||0; return {kcal:a.kcal+f.kcal*n, protein:a.protein+f.protein*n, carb:a.carb+f.carb*n, fat:a.fat+f.fat*n}; },{kcal:0,protein:0,carb:0,fat:0});
    sh.querySelector('#fp-tot').innerHTML = `<div><b>${fmt(s.kcal)}</b><span>大卡</span></div><div><b>${fmt(s.protein)}</b><span>蛋白質 g</span></div><div><b>${fmt(s.carb)}</b><span>碳水 g</span></div><div><b>${fmt(s.fat)}</b><span>脂肪 g</span></div>`;
  };
  draw();
  sh.querySelector('#fp-q').addEventListener('input', draw);
  sh.querySelector('#fp-list').addEventListener('click', e=>{
    const b = e.target.closest('[data-d]'); if(!b) return;
    const id = Number(b.dataset.id); qty[id] = Math.max(0, (qty[id]||0) + Number(b.dataset.d));
    sh.querySelector(`[data-q="${id}"]`).value = qty[id]; drawTot();
  });
  sh.querySelector('#fp-list').addEventListener('input', e=>{
    const i = e.target.closest('[data-q]'); if(!i) return; qty[Number(i.dataset.q)] = Math.max(0,num(i.value)); drawTot();
  });
  sh.querySelector('#fp-ok').onclick = () => {
    const picked = foods.filter(f=>(qty[f.id]||0) > 0).map(f=>{ const n = qty[f.id]; return {name:f.name, amount:`${n} 份（${f.servingDesc||'1 份'}）`, kcal:Math.round(f.kcal*n), protein:Math.round(f.protein*n), carb:Math.round(f.carb*n), fat:Math.round(f.fat*n), foodId:f.id}; });
    if(!picked.length){ toast('請先調整份數'); return; }
    closeSheet(); onDone(picked);
  };
}

async function monthTotals(a,b){
  const ms = await DB.meals.where('date').between(a,b,true,true).toArray();
  const by = {};
  for(const m of ms){ const s = sumItems(m.items); const o = by[m.date] || (by[m.date]={kcal:0,protein:0}); o.kcal+=s.kcal; o.protein+=s.protein; }
  return by;
}

  const a = `${y}-${pad(m)}-01`, b = `${y}-${pad(m)}-${pad(days)}`;
  const by = await monthTotals(a,b);
  const t = today();

/* ========= 趨勢 ========= */
function niceMax(v){ if(v<=0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/p*2)/2*p; }
function barChart({labels, values, band, floor, max, barCls, pbar}){
  const W=340,H=170,pl=36,pr=6,pt=8,pb=20, iw=W-pl-pr, ih=H-pt-pb, n=values.length;
  const top = niceMax(Math.max(max, ...values));
  const y = v => pt + ih - (v/top)*ih, step = iw/n, bw = Math.max(3, step*0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of [0, top/2, top]) s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}"/><text class="axis" x="${pl-4}" y="${y(g)+3}" text-anchor="end">${fmt(g)}</text>`;
  if(band) s += `<rect class="bandr" x="${pl}" width="${iw}" y="${y(band[1])}" height="${y(band[0])-y(band[1])}"/>`;
  if(floor) s += `<line class="floorl" x1="${pl}" x2="${W-pr}" y1="${y(floor)}" y2="${y(floor)}"/>`;
  const every = Math.ceil(n/7);
  values.forEach((v,i)=>{
    const x = pl + step*i + (step-bw)/2;
    if(v > 0) s += `<rect class="${pbar?'pbar':'bar '+(barCls?barCls(v,i):'')}" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(1,y(0)-y(v))}" rx="2"/>`;
    if((i % every === 0 && n-1-i >= Math.ceil(every*0.7)) || i === n-1) s += `<text class="axis" x="${pl+step*i+step/2}" y="${H-5}" text-anchor="middle">${labels[i]}</text>`;
  });
  return s + '</svg>';
}
function lineChart(labels, values){
  const pts = values.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
  if(pts.length < 2) return '<div class="empty">體重紀錄少於 2 筆，輸入「早上 82.6 公斤」即可記錄</div>';
  const W=340,H=160,pl=36,pr=10,pt=10,pb=20, iw=W-pl-pr, ih=H-pt-pb, n=values.length;
  const vs = pts.map(p=>p[1]); let lo = Math.floor(Math.min(...vs)-0.5), hi = Math.ceil(Math.max(...vs)+0.5);
  const x = i => pl + (n===1?iw/2:iw*i/(n-1)), y = v => pt + ih - (v-lo)/(hi-lo)*ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(const g of [lo,(lo+hi)/2,hi]) s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}"/><text class="axis" x="${pl-4}" y="${y(g)+3}" text-anchor="end">${Math.round(g*10)/10}</text>`;
  s += `<polyline class="wline" points="${pts.map(p=>`${x(p[0])},${y(p[1])}`).join(' ')}"/>`;
  pts.forEach(p=> s += `<circle class="wdot" cx="${x(p[0])}" cy="${y(p[1])}" r="3"/>`);
  const every = Math.ceil(n/7);
  labels.forEach((l,i)=>{ if((i%every===0 && n-1-i>=Math.ceil(every*0.7))||i===n-1) s += `<text class="axis" x="${x(i)}" y="${H-5}" text-anchor="middle">${l}</text>`; });
  return s + '</svg>';
}
async function renderTrend(v){
  const N = state.trendRange, t0 = today(), start = addDays(t0, -(N-1));
  const lastM = (await DB.meals.orderBy('date').reverse().limit(1).toArray())[0];
  const lastW = (await DB.bodyLogs.orderBy('date').reverse().limit(1).toArray())[0];
  let end = t0;
  for(const x of [lastM, lastW]) if(x && x.date > end) end = x.date;
  if(end > addDays(t0,30)) end = addDays(t0,30);
  const dates = Array.from({length:diffDays(end,start)+1}, (_,i)=>addDays(start,i));
  const by = await monthTotals(start, end);
  const wl = await DB.bodyLogs.where('date').between(start,end,true,true).toArray();
  const wBy = {}; wl.sort((a,b)=>a.createdAt-b.createdAt).forEach(x=>wBy[x.date]=x.weight);
  const kc = dates.map(d=>by[d]?by[d].kcal:0), pr = dates.map(d=>by[d]?by[d].protein:0);
  const labels = dates.map(md2);
  const done = dates.filter(d=>by[d] && d!==t0);
  const avgK = done.length ? done.reduce((s,d)=>s+by[d].kcal,0)/done.length : 0;
  const avgP = done.length ? done.reduce((s,d)=>s+by[d].protein,0)/done.length : 0;
  const hit = done.filter(d=>by[d].kcal>=S.kcalMin && by[d].kcal<=S.kcalMax).length;
  const ws = dates.map(d=>wBy[d]??null).filter(x=>x!=null);
  const wDiff = ws.length>=2 ? (ws[ws.length-1]-ws[0]) : null;
  v.innerHTML = `<div class="seg" style="margin-top:12px">${[7,14,30].map(n=>`<button class="${N===n?'on':''}" data-act="trendRange" data-n="${n}">近 ${n} 天</button>`).join('')}</div>
    <div class="stats" style="margin-top:12px">
      <div class="stat"><span>平均熱量（不含今天）</span><b class="num">${done.length?fmt(avgK):'—'}</b></div>
      <div class="stat"><span>平均蛋白質 g</span><b class="num">${done.length?fmt(avgP):'—'}</b></div>
      <div class="stat"><span>熱量達標天數</span><b class="num">${hit} / ${done.length}</b></div>
      <div class="stat"><span>體重變化 kg</span><b class="num">${wDiff==null?'—':(wDiff>0?'+':'')+wDiff.toFixed(1)}</b></div>
    </div>
    <section class="card chart"><div class="between"><b>每日熱量</b><span class="small muted">綠帶為目標，虛線為底線</span></div>
      ${barChart({labels, values:kc, band:[S.kcalMin,S.kcalMax], floor:S.floor, max:S.tdeeMax, barCls:(val,i)=>{ const c = kcalStatus(val, dates[i]>=t0).cls; return c==='good'?'':c; }})}</section>
    <section class="card chart"><div class="between"><b>每日蛋白質</b><span class="small muted">綠帶為 ${S.pMin}–${S.pMax} g</span></div>
      ${barChart({labels, values:pr, band:[S.pMin,S.pMax], max:S.pMax, pbar:true})}</section>
    <section class="card chart"><div class="between"><b>體重</b><button class="chip-btn" data-act="logWeight">記錄體重</button></div>
      ${lineChart(labels, dates.map(d=>wBy[d]??null))}</section>`;
}

  },
  prevDay: () => { state.date = addDays(state.date,-1); render(); },
  nextDay: () => { state.date = addDays(state.date,1); render(); },
  pickDay: b => { state.date = b.dataset.d; state.stripFor = state.date; window.scrollTo(0,0); render(); },
  openCal: () => openCalSheet(),
  goToday: () => goDate(today()),
  mealType: b => { state.mealType = b.dataset.k; renderMealSeg(); },
  pickPhoto: () => pickImage(addComposerPhotos),
  removePhoto: b => { state.photos.splice(Number(b.dataset.i),1); renderMealSeg(); updateComposeHeight(); },
  clearPhoto: () => { state.photos = []; renderMealSeg(); updateComposeHeight(); },
  quickFood: () => openFoodPicker(items => openMealEditor({date:state.date, mealType:defaultMealType(), items, comment:'', isNew:true})),
  send: () => send(),
  review: () => review(),
  editMeal: async b => { const m = await DB.meals.get(Number(b.dataset.id)); if(m) openMealEditor({...m, isNew:false}); },
  retryMeal: b => retryRecognition(Number(b.dataset.id)),
  addMeal: () => openMealEditor({date:state.date, mealType:defaultMealType(), items:[], comment:'', isNew:true, manual:true}),
  addAct: () => openActEditor(null),
  editAct: async b => { if(b.dataset.id){ const a = await DB.activities.get(Number(b.dataset.id)); if(a) openActEditor(a); } else openActEditor(null, b.dataset.kind); },
  editWeight: () => openWeightEditor(state.date),
  delAct: async b => { if(!confirm('刪除這筆運動紀錄？')) return; await DB.activities.delete(Number(b.dataset.id)); render(); },
  calPrev: () => { const [y,m] = state.calMonth.split('-').map(Number); const d = new Date(y,m-2,1); state.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); },
  calNext: () => { const [y,m] = state.calMonth.split('-').map(Number); const d = new Date(y,m,1); state.calMonth = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; render(); },
  calDay: b => { state.date = b.dataset.d; state.tab = 'today'; window.scrollTo(0,0); render(); },
  trendRange: b => { state.trendRange = Number(b.dataset.n); render(); },
  addFood: () => openFoodForm({}),
  editFood: async b => { const f = await DB.foods.get(Number(b.dataset.id)); if(f) openFoodForm(f); },
  labelScan: () => $('#labelInput').click(),
  logWeight: () => openWeightEditor(today()),
  toggleKey: b => { const i = $('#s-apiKey'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? '隱藏' : '顯示'; },
  saveSettings: async () => { S = {...S, ...readSettingsForm()}; await saveSettings(); toast('設定已儲存'); },
  calcBmr: () => {
    const w = num($('#s-weight').value), h = num($('#s-height').value), a = num($('#s-age').value), male = $('#s-sex').value === 'male';
    const bmr = Math.round(10*w + 6.25*h - 5*a + (male ? 5 : -161));
    $('#s-bmr').value = bmr; $('#s-floor').value = bmr; toast(`BMR 約 ${fmt(bmr)} 大卡，記得按儲存`);
  },
  testKey: async () => {
    S = {...S, ...readSettingsForm()}; await saveSettings();
    toast('測試中…', 1500);
    try{ await callGemini([{text:'回覆 {"ok":true}'}], '只輸出 JSON。', 0); toast('金鑰可以使用 ✓'); }
    catch(e){ toast(e.message === 'NO_KEY' ? '請先貼上金鑰' : e.message, 4500); }
  },
  listModels: () => fillModelSelects(true),
  rerunWizard: () => openWizard(),
  adjNow: async () => {
    const st = await computeStats();
    if(st.loggedDays < 5){ toast(`近兩週飲食紀錄只有 ${st.loggedDays} 天，至少需要 5 天`); return; }
    state.tab = 'today'; state.date = today(); window.scrollTo(0,0);
    await createAdjustment();
  },
  adjApply: async b => {
    const a = await DB.adjustments.get(Number(b.dataset.id)); if(!a) return;
    S = {...S, ...a.to, lastAdjustDate: today()}; await saveSettings();
    await DB.adjustments.update(a.id, {status:'applied', decidedAt:Date.now()});
    toast('已套用新目標'); render();
  },
  adjSkip: async b => {
    if(!confirm('這次不調整？兩週後會再提出建議。')) return;
    await DB.adjustments.update(Number(b.dataset.id), {status:'dismissed', decidedAt:Date.now()});
    S.lastAdjustDate = today(); await saveSettings(); render();
  },
  clearAll: async () => {
    if(!confirm('確定清除全部餐點、運動、體重與對話紀錄？此動作無法復原。')) return;
    if(!confirm('再次確認：清除後無法救回。')) return;
    await Promise.all([DB.meals.clear(), DB.photos.clear(), DB.activities.clear(), DB.bodyLogs.clear(), DB.chats.clear()]);
    photoURL.clear(); toast('已清除');
  }
};
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.act]; if(fn){ e.preventDefault(); fn(b, e); }
});
$('#photoInput').addEventListener('change', async e=>{
  const fs = [...e.target.files]; e.target.value=''; if(fs.length) addComposerPhotos(fs);
});
$('#labelInput').addEventListener('change', e=>{ const file = e.target.files[0]; e.target.value=''; if(file) scanLabel(file); });
document.addEventListener('change', async e=>{
  const id = e.target.id;
  const mf = MODEL_FIELDS.find(f=>f[0] === '#' + id);
  if(mf){
    S[mf[1]] = e.target.value; S.modelManual = true;
    await saveSettings(); toast('已切換模型');
  }
  if(id === 's-apiKey') fillModelSelects();
});
const ta = $('#msg');
function autoGrow(){ ta.style.height='auto'; ta.style.height = Math.min(108, ta.scrollHeight + 2) + 'px'; updateComposeHeight(); }  // 最多 4 行，超過在框內滑動
ta.addEventListener('input', autoGrow);
window.addEventListener('scroll', ()=>{ $('#top').classList.toggle('scrolled', scrollY>4); updateJump(); }, {passive:true});
window.addEventListener('resize', updateJump);
document.addEventListener('visibilitychange', ()=>{
  // 跨日自動切換到今天
  if(document.visibilityState === 'visible' && state.tab === 'today' && state.lastToday && state.lastToday !== today() && state.date === state.lastToday){
    state.date = today(); state.mealType = defaultMealType(); render();
  }
  state.lastToday = today();
});

/* ========= 啟動 ========= */
(async function init(){
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    await loadSettings(); await seed();
    state.date = today(); state.lastToday = today(); state.mealType = defaultMealType();
    state.calMonth = today().slice(0,7);
    await render();
    if(!S.profileDone) openWizard();
    else if(S.apiKey) refreshModelList(S.apiKey).catch(()=>{});
    new ResizeObserver(updateComposeHeight).observe($('#composer'));
  }catch(e){
    $('#view').innerHTML = `<div class="card">啟動失敗：${esc(e.message)}<br><span class="small muted">請確認網路連線後重新開啟。</span></div>`;
  }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
